name: PinAI Workspace Checks
on:
  pull_request:
    paths:
      - "src/components/workspace/**"
      - "src/lib/workspace/**"
      - "src/routes/workspace.tsx"
      - "src/routeTree.gen.ts"
      - "src/components/terminal/terminal-app.tsx"
      - "package.json"
      - ".github/workflows/workspace-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test workspace invariants
        run: node --experimental-strip-types --test src/lib/workspace/model.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test full application
        run: npm test
      - name: Production build
        run: npm run build
